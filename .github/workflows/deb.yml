name: Termux package

# The Termux package of Retro Desktop for 64-bit ARM phones and tablets
# (retro-desktop_<version>_aarch64.deb), cross-built with the Android NDK
# the runner has, with the programs from Retro Nim UI's examples. A quick
# check of the desktop runs on Linux first (on Xvfb: it manages an X
# program's window, opens its own programs; the screen is kept).
#
# It runs on every push and pull request (the package as the run's
# artifact) and puts the package on the release when a version tag is
# pushed (git push origin v0.1.0). RETROUI_REF: the Retro Nim UI branch or
# tag it builds with.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  RETROUI_REF: main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retro Nim UI
        run: git clone --depth 1 --branch "$RETROUI_REF" https://github.com/foxoman/retroui build/retroui
      - name: X tools
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-apps x11-utils imagemagick
      - name: Build
        run: nim c -d:release --hints:off --path:build/retroui/src -o:bin/retro-desktop src/retrodesktop.nim
      - name: Smoke test
        run: sh tools/smoke.sh bin/retro-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screen
          path: build/smoke.png

  termux:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retro Nim UI
        run: git clone --depth 1 --branch "$RETROUI_REF" https://github.com/foxoman/retroui build/retroui
      - name: Package
        env:
          RETROUI_SRC: build/retroui
          # (Retro Mail's app IDs, from the repository's secrets when it has
          # them; without them Mail asks each user for their own)
          RETRO_MAIL_MICROSOFT_ID: ${{ secrets.RETRO_MAIL_MICROSOFT_ID }}
          RETRO_MAIL_GOOGLE_ID: ${{ secrets.RETRO_MAIL_GOOGLE_ID }}
          RETRO_MAIL_GOOGLE_SECRET: ${{ secrets.RETRO_MAIL_GOOGLE_SECRET }}
        run: |
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sh tools/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: retro-desktop-termux-aarch64
          path: build/*.deb
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          name: Retro Desktop ${{ github.ref_name }}
          generate_release_notes: true
